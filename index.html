<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Mapa interativo da campanha de RPG Rio Invisível — Rio de Janeiro">
    <meta name="theme-color" content="#1a1a2e">
    <title>Rio Invisível — Mapa da Campanha</title>

    <!-- Como ainda não existe um favicon.ico de verdade, uso um
         SVG simples desenhado por código (funciona igual, e é
         mais fácil de trocar depois se você desenhar um seu). -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Como o link vai aparecer se alguém compartilhar (WhatsApp,
         Discord, etc.) — detalhe pequeno, mas deixa mais profissional. -->
    <meta property="og:title" content="Rio Invisível — Mapa da Campanha">
    <meta property="og:description" content="Mapa interativo da campanha de RPG Rio Invisível — Rio de Janeiro">
    <meta property="og:type" content="website">

    <!-- MapLibre -->
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
    <!-- CSS do projeto -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app" class="barra-bairros-recolhida">

        <div id="mapa"></div>

        <!-- Barra fixa do topo: agora retrátil (o botão à esquerda
             recolhe/expande) — diferente da barra lateral de
             Descobertas só na aparência, o mecanismo é parecido.
             Começa FECHADA a cada novo acesso (classe
             "barra-bairros-recolhida" já vem no #app acima; o
             botão abaixo já nasce com o texto/atributos do
             estado fechado, condizentes com isso). Tem um
             <select> com os bairros (preenchido pelo script.js a
             partir de dados/bairros.json) e, ao lado, o texto de
             "info" daquele bairro — também vindo do mesmo JSON. -->
        <header id="barra-bairros">
            <button type="button" id="alternar-barra-bairros" aria-expanded="false" aria-controls="barra-bairros-conteudo" aria-label="Expandir barra de bairros">▼</button>
            <div id="barra-bairros-conteudo">
                <label for="seletor-bairro">Bairro</label>
                <select id="seletor-bairro">
                    <option value="">Selecione um bairro...</option>
                    <!-- Preenchido automaticamente pelo script.js, com
                         base no array de dados/bairros.json -->
                </select>
                <p id="info-bairro"></p>
            </div>
        </header>

        <div id="ui">
            <!-- Escurece o mapa por trás quando a barra lateral abre,
                 e fecha ela se você clicar fora. Precisa estar ANTES
                 dos outros elementos aqui dentro pra ficar "embaixo"
                 deles (a ordem no HTML importa pra isso). -->
            <div id="barra-lateral-fundo"></div>

            <div id="filtros">
                <button type="button" class="filtro-botao ativo" data-categoria="local">Locais <span class="filtro-contagem"></span></button>
                <button type="button" class="filtro-botao ativo" data-categoria="npc">NPCs <span class="filtro-contagem"></span></button>
                <button type="button" class="filtro-botao ativo" data-categoria="faccao">Facções <span class="filtro-contagem"></span></button>
            </div>

            <button type="button" id="botao-lista">☰ Descobertas</button>

            <aside id="barra-lateral">
                <div id="barra-lateral-cabecalho">
                    <h2>Descobertas</h2>
                    <button type="button" id="fechar-lista" aria-label="Fechar lista">✕</button>
                </div>
                <div id="barra-lateral-controles">
                    <input type="search" id="busca-lista" placeholder="Pesquisar por título ou descrição..." aria-label="Pesquisar descobertas">
                    <div id="filtros-lista">
                        <button type="button" class="filtro-botao filtro-lista-botao ativo" data-categoria="local">Locais <span class="filtro-contagem"></span></button>
                        <button type="button" class="filtro-botao filtro-lista-botao ativo" data-categoria="npc">NPCs <span class="filtro-contagem"></span></button>
                        <button type="button" class="filtro-botao filtro-lista-botao ativo" data-categoria="faccao">Facções <span class="filtro-contagem"></span></button>
                    </div>
                </div>
                <div id="lista-conteudo">
                    <!-- Preenchido automaticamente pelo script.js,
                         com base no array "locais" -->
                </div>
            </aside>
        </div>

        <div id="carregando">
            <p>Carregando o Rio Invisível...</p>
        </div>

        <!-- Lightbox: mostra a foto do popup em tamanho grande.
             Fica escondido (via CSS) até alguém clicar numa foto.
             "lightbox-lupa" é a caixinha de zoom extra: clicando
             na foto (dentro do lightbox) ela liga, e passa a
             seguir o mouse mostrando um recorte ampliado de onde
             o cursor está — clicar de novo na foto desliga. -->
        <div id="lightbox">
            <button type="button" id="lightbox-anterior" aria-label="Foto anterior">‹</button>
            <img id="lightbox-imagem" src="" alt="">
            <button type="button" id="lightbox-proxima" aria-label="Próxima foto">›</button>
            <div id="lightbox-lupa" aria-hidden="true"></div>
        </div>

    </div>

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <!-- JavaScript do projeto -->
    <script src="script.js"></script>
</body>
</html>
